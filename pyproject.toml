[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recurrence-agent"
version = "0.1.0"
description = "CLI-first research-state harness for AI-assisted mathematics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.0",
]

[project.scripts]
rec = "rec.cli:main"

[tool.setuptools.packages.find]
include = ["rec*"]

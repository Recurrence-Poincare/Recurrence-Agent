name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile package
        run: python -m compileall rec
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run dry-run artifact check
        run: python -m rec run examples/problem-template.md --out runs/dry-run --dry-run
      - name: Run privacy scan
        run: python scripts/privacy_scan.py
